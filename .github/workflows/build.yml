name: build-spike

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: contents write is needed only to publish the test pre-release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle version is pinned here instead of via a wrapper (wrapper files could not
      # be generated offline). Android Studio users get a wrapper automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thornberry-spike-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Rolling TEST pre-release so the APK can be downloaded straight to a phone.
      # Debug build, no secrets, no real data. Not a product release.
      - name: Publish rolling test pre-release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike-latest --yes --cleanup-tag || true
          cp app/build/outputs/apk/debug/app-debug.apk thornberry-spike-debug.apk
          gh release create spike-latest thornberry-spike-debug.apk \
            --prerelease \
            --title "Spike test build (not a release)" \
            --notes "Debug build for feasibility testing only. Do not use for real data. Built from commit ${{ github.sha }}."
