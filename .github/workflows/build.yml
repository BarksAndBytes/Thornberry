name: build-spike

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: contents write is needed only to publish the test pre-release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle version is pinned here instead of via a wrapper (wrapper files could not
      # be generated offline). Android Studio users get a wrapper automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APKs (spike and chat)
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      # Build logs cannot be downloaded from some environments, so surface the
      # important lines as annotations (readable through the REST API).
      - name: Report build errors as annotations
        if: failure()
        run: |
          out=$(grep -E "^e: |error:|What went wrong|Could not resolve|FAILED|Execution failed" build.log | head -n 25 | cut -c1-300)
          echo "::error title=build-errors::${out//$'\n'/%0A}"

      - name: List native libraries packaged in the APK
        run: |
          out=$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so$|\.apk$|Archive" | awk '{print $1, $4}')
          size=$(ls -l app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
          echo "::notice title=apk-native-libs::APK bytes: $size%0A${out//$'\n'/%0A}"

      - name: List chat app native libraries
        run: |
          out=$(unzip -l chat/build/outputs/apk/debug/chat-debug.apk | grep -E "\.so$|Archive" | awk '{print $1, $4}')
          size=$(ls -l chat/build/outputs/apk/debug/chat-debug.apk | awk '{print $5}')
          echo "::notice title=chat-apk::APK bytes: $size%0A${out//$'\n'/%0A}"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thornberry-spike-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload chat APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thornberry-chat-debug-apk
          path: chat/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Rolling TEST pre-release so the APK can be downloaded straight to a phone.
      # Debug build, no secrets, no real data. Not a product release.
      - name: Publish rolling test pre-release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike-latest --yes --cleanup-tag || true
          cp app/build/outputs/apk/debug/app-debug.apk thornberry-spike-debug.apk
          gh release create spike-latest thornberry-spike-debug.apk \
            --prerelease \
            --title "Spike test build (not a release)" \
            --notes "Debug build for feasibility testing only. Do not use for real data. Built from commit ${{ github.sha }}."

      # Second rolling TEST pre-release for the chat app (separate app, installs next to the spike).
      - name: Publish chat test pre-release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete chat-latest --yes --cleanup-tag || true
          cp chat/build/outputs/apk/debug/chat-debug.apk thornberry-chat-debug.apk
          # version.json is what the app checks on launch (small; the APK address is fixed in the app).
          vc=$(grep -oE 'versionCode = [0-9]+' chat/build.gradle.kts | grep -oE '[0-9]+')
          vn=$(grep -oE 'versionName = "[^"]+"' chat/build.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          sha=$(sha256sum thornberry-chat-debug.apk | cut -d' ' -f1)
          size=$(stat -c %s thornberry-chat-debug.apk)
          printf '{"versionCode":%s,"versionName":"%s","commit":"%s","apk":"thornberry-chat-debug.apk","size":%s,"sha256":"%s"}\n' \
            "$vc" "$vn" "${{ github.sha }}" "$size" "$sha" > version.json
          cat version.json
          gh release create chat-latest thornberry-chat-debug.apk version.json \
            --prerelease \
            --title "Chat test build (not a release)" \
            --notes "Debug build for testing only. Test data only. Built from commit ${{ github.sha }}."
