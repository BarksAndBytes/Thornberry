name: core-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run crypto tests
        run: |
          set -o pipefail
          gradle --no-daemon :core:test 2>&1 | tee test.log
      - name: Report results as annotations
        if: always()
        run: |
          out=$( (grep -E " FAILED$" -A 8 test.log; grep -E "PASSED|^e: |What went wrong|Could not resolve" test.log) | head -n 60 | cut -c1-300)
          echo "::notice title=core-test-results::${out//$'\n'/%0A}"
