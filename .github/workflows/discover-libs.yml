# One-off discovery: report which versions of the Tor-related Maven artifacts exist and what the
# Tor Android package contains. Read-only; builds nothing; publishes nothing.
# Results are emitted as annotations so they can be read through the REST API.
name: discover-libs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Maven Central metadata
        run: |
          out=""
          for a in tor-android lyrebird-android onionwrapper-android onionwrapper-core dont-kill-me-lib null-safety jtorctl; do
            v=$(curl -fsS "https://repo1.maven.org/maven2/org/briarproject/$a/maven-metadata.xml" \
              | grep -E "<(release|version)>" | sed -E 's/ *<\/?(release|version)>//g' | tr '\n' ' ') || v="NOT FOUND"
            out="$out$a: $v"$'\n'
          done
          echo "::notice title=maven-versions::${out//$'\n'/%0A}"

      - name: Inspect tor-android package
        run: |
          v=$(curl -fsS "https://repo1.maven.org/maven2/org/briarproject/tor-android/maven-metadata.xml" | grep -o "<release>[^<]*" | sed 's/<release>//')
          for ext in aar jar; do
            if curl -fsSL -o tor.pkg "https://repo1.maven.org/maven2/org/briarproject/tor-android/$v/tor-android-$v.$ext"; then found=$ext; break; fi
          done
          out="release=$v type=${found:-none}"$'\n'"$(ls -l tor.pkg 2>&1)"$'\n'"$(unzip -l tor.pkg 2>&1 | head -25)"
          echo "::notice title=tor-android-contents::${out//$'\n'/%0A}"
