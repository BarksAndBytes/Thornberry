# One-off discovery: report latest versions and declared licenses of candidate Maven artifacts.
# Read-only; builds nothing; publishes nothing. Results are emitted as annotations.
name: discover-libs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Latest versions and licenses
        run: |
          out=""
          for ga in \
            org.signal:libsignal-client \
            org.signal:libsignal-android \
            org.bouncycastle:bcprov-jdk18on \
            com.google.crypto.tink:tink-android \
            com.google.crypto.tink:tink \
            com.goterl:lazysodium-android \
            com.goterl:lazysodium-java \
            com.rweather:noise-java \
            org.whispersystems:signal-protocol-java; do
            g=${ga%%:*}; a=${ga##*:}; gp=${g//./\/}
            meta=$(curl -fsS "https://repo1.maven.org/maven2/$gp/$a/maven-metadata.xml" 2>/dev/null) || { out="$out$ga: NOT FOUND"$'\n'; continue; }
            rel=$(echo "$meta" | grep -o "<release>[^<]*" | sed 's/<release>//')
            [ -z "$rel" ] && rel=$(echo "$meta" | grep -o "<latest>[^<]*" | sed 's/<latest>//')
            [ -z "$rel" ] && rel=$(echo "$meta" | grep -o "<version>[^<]*" | tail -1 | sed 's/<version>//')
            lic=$(curl -fsS "https://repo1.maven.org/maven2/$gp/$a/$rel/$a-$rel.pom" 2>/dev/null | tr -d '\n' | grep -o "<licenses>.*</licenses>" | sed -E 's/<\/?[a-z]+>/ /g; s/  +/ /g' | cut -c1-160)
            last=$(echo "$meta" | grep -o "<lastUpdated>[^<]*" | sed 's/<lastUpdated>//')
            out="$out$ga: release=$rel updated=$last license=[$lic]"$'\n'
          done
          echo "::notice title=crypto-candidates::${out//$'\n'/%0A}"
