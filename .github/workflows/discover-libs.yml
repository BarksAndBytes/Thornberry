# One-off discovery: list which crypto classes exist inside candidate libraries.
# Read-only; builds nothing; publishes nothing. Results are emitted as annotations.
name: discover-libs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tink classes
        run: |
          v=1.24.0
          curl -fsSL -o tink.aar "https://repo1.maven.org/maven2/com/google/crypto/tink/tink-android/$v/tink-android-$v.aar" \
            || curl -fsSL -o tink.aar "https://repo1.maven.org/maven2/com/google/crypto/tink/tink-android/$v/tink-android-$v.jar"
          mkdir t && cd t && unzip -q ../tink.aar && ls
          jar=$( [ -f classes.jar ] && echo classes.jar || echo ../tink.aar )
          out=$(unzip -l $jar | awk '{print $4}' | grep -E "subtle/(X25519|Ed25519|Hkdf|XChaCha20Poly1305|ChaCha20Poly1305|Random|EngineFactory)\.class|hybrid/HpkeConfig|signature/Ed25519" | sed 's#com/google/crypto/tink/##' | head -30)
          echo "::notice title=tink-classes::${out//$'\n'/%0A}"
      - name: Bouncy Castle classes
        run: |
          v=1.86
          curl -fsSL -o bc.jar "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/$v/bcprov-jdk18on-$v.jar"
          ls -l bc.jar | awk '{print "bytes", $5}'
          out=$(unzip -l bc.jar | awk '{print $4}' | grep -E "crypto/(agreement/X25519Agreement|signers/Ed25519Signer|modes/ChaCha20Poly1305|generators/HKDFBytesGenerator|digests/Blake2bDigest|engines/XChaCha20|modes/XChaCha)" | sed 's#org/bouncycastle/##' | head -30)
          echo "::notice title=bc-classes::bytes $(stat -c %s bc.jar)%0A${out//$'\n'/%0A}"
